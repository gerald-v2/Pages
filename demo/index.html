<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Catalog & Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-28">

  <!-- =========================================================
       EDIT ONLY THIS CONFIG BLOCK FOR EACH NEW CLIENT (2 MINS)
       ========================================================= -->
  <script>
    const BUSINESS_CONFIG = {
      name: "Glow & Glam Studio Harare",
      tagline: "Luxury Nails, Lashes & Braids • Walk-ins & Bookings",
      location: "Avondale, Harare (Near King George Rd)",
      hours: "Mon–Sat: 8:00 AM – 6:00 PM",
      whatsappNumber: "263771234567",
      accentColor: "emerald",
      currency: "$",
      instagramHandle: "@glowglam_hre",
      items: [
        { id: 1, category: "Nails", name: "Gel Overlay (Hands)", price: 15, desc: "Includes cuticle prep & solid gel polish" },
        { id: 2, category: "Nails", name: "Acrylic Full Set (Medium)", price: 25, desc: "Choice of coffin, almond, or square + 1 design" },
        { id: 3, category: "Lashes", name: "Classic Lash Extensions", price: 20, desc: "Natural everyday volume, lasts 3–4 weeks" },
        { id: 4, category: "Lashes", name: "Hybrid / Volume Set", price: 30, desc: "Full fluffy look with custom curl mapping" },
        { id: 5, category: "Hair", name: "Knotless Braids (Mid-Back)", price: 35, desc: "Neat parting, lightweight finish" },
        { id: 6, category: "Hair", name: "Wash, Blowdry & Silk Press", price: 18, desc: "Deep conditioning treatment included" }
      ]
    };
  </script>

  <!-- HEADER / HERO -->
  <header id="hero-banner" class="bg-emerald-600 text-white px-5 pt-8 pb-6 shadow-md">
    <div class="max-w-lg mx-auto">
      <div class="flex items-center justify-between">
        <span id="biz-ig" class="text-xs font-medium bg-white/20 px-2.5 py-1 rounded-full"></span>
        <span class="text-xs font-medium bg-white/20 px-2.5 py-1 rounded-full">● Open Today</span>
      </div>
      <h1 id="biz-name" class="text-2xl font-bold mt-3 tracking-tight"></h1>
      <p id="biz-tagline" class="text-sm text-white/90 mt-1"></p>
      <div class="mt-4 pt-3 border-t border-white/20 text-xs space-y-1 text-white/90">
        <p id="biz-location"></p>
        <p id="biz-hours"></p>
      </div>
    </div>
  </header>

  <!-- CATEGORY FILTER PILLS -->
  <main class="max-w-lg mx-auto px-4 mt-5">
    <div id="category-tabs" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar"></div>

    <!-- MENU / PRODUCT LIST -->
    <div id="items-container" class="mt-3 space-y-3"></div>
  </main>

  <!-- STICKY BOTTOM WHATSAPP ORDER BAR -->
  <div class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 px-4 py-3 shadow-lg z-50">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-3">
      <div>
        <p id="cart-summary" class="text-xs text-slate-500">Tap "+ Add" to build an order</p>
        <p id="cart-total" class="text-base font-bold text-slate-900">$0.00</p>
      </div>
      <button
        onclick="sendWhatsAppOrder()"
        class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition text-white font-semibold text-sm px-5 py-3 rounded-xl flex items-center gap-2 shadow-sm">
        <span>Send on WhatsApp</span>
        <span>→</span>
      </button>
    </div>
  </div>

  <!-- DYNAMIC RENDER & WHATSAPP ORDER ENGINE -->
  <script>
    const cart = {};
    let activeCategory = "All";

    const colorMap = {
      emerald: { bg: "bg-emerald-600", btn: "bg-emerald-600 hover:bg-emerald-700", pill: "bg-emerald-600 text-white", text: "text-emerald-700" },
      rose:    { bg: "bg-rose-600",    btn: "bg-rose-600 hover:bg-rose-700",       pill: "bg-rose-600 text-white",    text: "text-rose-700" },
      amber:   { bg: "bg-amber-600",   btn: "bg-amber-600 hover:bg-amber-700",     pill: "bg-amber-600 text-white",   text: "text-amber-700" },
      indigo:  { bg: "bg-indigo-600",  btn: "bg-indigo-600 hover:bg-indigo-700",   pill: "bg-indigo-600 text-white",  text: "text-indigo-700" },
      sky:     { bg: "bg-sky-600",     btn: "bg-sky-600 hover:bg-sky-700",         pill: "bg-sky-600 text-white",     text: "text-sky-700" }
    };

    const theme = colorMap[BUSINESS_CONFIG.accentColor] || colorMap.emerald;

    function initPage() {
      document.getElementById("page-title").textContent = BUSINESS_CONFIG.name;
      document.getElementById("biz-name").textContent = BUSINESS_CONFIG.name;
      document.getElementById("biz-tagline").textContent = BUSINESS_CONFIG.tagline;
      document.getElementById("biz-location").textContent = "📍 " + BUSINESS_CONFIG.location;
      document.getElementById("biz-hours").textContent = "🕒 " + BUSINESS_CONFIG.hours;
      document.getElementById("biz-ig").textContent = BUSINESS_CONFIG.instagramHandle;

      const hero = document.getElementById("hero-banner");
      hero.className = `${theme.bg} text-white px-5 pt-8 pb-6 shadow-md`;

      renderCategories();
      renderItems();
      updateCartUI();
    }

    function renderCategories() {
      const categories = ["All", ...new Set(BUSINESS_CONFIG.items.map(i => i.category))];
      const tabsEl = document.getElementById("category-tabs");
      tabsEl.innerHTML = categories.map(cat => `
        <button
          onclick="setCategory('${cat}')"
          class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
            activeCategory === cat ? theme.pill : "bg-white text-slate-600 border border-slate-200"
          }">
          ${cat}
        </button>
      `).join("");
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById("items-container");
      const filtered = activeCategory === "All"
        ? BUSINESS_CONFIG.items
        : BUSINESS_CONFIG.items.filter(i => i.category === activeCategory);

      container.innerHTML = filtered.map(item => {
        const qty = cart[item.id] || 0;
        return `
          <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between gap-3">
            <div class="flex-1">
              <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">${item.category}</span>
              <h3 class="font-semibold text-slate-900 text-sm mt-0.5">${item.name}</h3>
              <p class="text-xs text-slate-500 mt-1 leading-relaxed">${item.desc}</p>
              <p class="font-bold text-sm mt-2 ${theme.text}">${BUSINESS_CONFIG.currency}${item.price.toFixed(2)}</p>
            </div>
            <div class="flex items-center gap-2">
              ${qty > 0 ? `
                <button onclick="updateQty(${item.id}, -1)" class="w-8 h-8 rounded-lg bg-slate-100 font-bold text-slate-700">-</button>
                <span class="text-sm font-bold w-4 text-center">${qty}</span>
                <button onclick="updateQty(${item.id}, 1)" class="w-8 h-8 rounded-lg ${theme.btn} font-bold text-white">+</button>
              ` : `
                <button onclick="updateQty(${item.id}, 1)" class="px-3.5 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold active:scale-95 transition">
                  + Add
                </button>
              `}
            </div>
          </div>
        `;
      }).join("");
    }

    function updateQty(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      renderItems();
      updateCartUI();
    }

    function updateCartUI() {
      let total = 0;
      let count = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = BUSINESS_CONFIG.items.find(i => i.id == id);
        if (item) {
          total += item.price * qty;
          count += qty;
        }
      }
      document.getElementById("cart-summary").textContent = count > 0
        ? `${count} item${count > 1 ? "s" : ""} selected`
        : "Tap '+ Add' or message directly";
      document.getElementById("cart-total").textContent = `${BUSINESS_CONFIG.currency}${total.toFixed(2)}`;
    }

    function sendWhatsAppOrder() {
      const entries = Object.entries(cart);
      let message = `Hi ${BUSINESS_CONFIG.name}! 👋\n`;

      if (entries.length === 0) {
        message += `I saw your online catalog and would like to inquire / make a booking.`;
      } else {
        message += `I'd like to book/order the following:\n\n`;
        let total = 0;
        entries.forEach(([id, qty]) => {
          const item = BUSINESS_CONFIG.items.find(i => i.id == id);
          if (item) {
            const sub = item.price * qty;
            total += sub;
            message += `• ${qty}x ${item.name} (${BUSINESS_CONFIG.currency}${sub.toFixed(2)})\n`;
          }
        });
        message += `\n*Estimated Total: ${BUSINESS_CONFIG.currency}${total.toFixed(2)}*\nWhen is your next available slot?`;
      }

      const url = `https://wa.me/${BUSINESS_CONFIG.whatsappNumber}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    }

    initPage();
  </script>
</body>
</html>
